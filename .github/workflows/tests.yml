name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows editor and engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Set up Windows editor through its batch launcher
        shell: cmd
        run: call setup.cmd --no-pause
        timeout-minutes: 12
      - name: Verify bootstrap can be rerun safely
        shell: cmd
        run: .venv\Scripts\python.exe bootstrap_tools.py
      - name: Smoke test downloaded tools and Ruby ROM compiler
        shell: cmd
        run: .venv\Scripts\python.exe ci\windows_smoke.py
      - name: Check bundled Arabic font
        shell: cmd
        run: .venv\Scripts\python.exe -c "from engine.fnt6 import DEFAULT_ARABIC_FONT; assert DEFAULT_ARABIC_FONT.is_file(), DEFAULT_ARABIC_FONT"
      - name: Compile Python sources
        shell: cmd
        run: .venv\Scripts\python.exe -m compileall -q app.py engine ci
      - name: Run asset-free application and engine tests
        shell: cmd
        run: .venv\Scripts\python.exe -m unittest discover -s engine/tests -v
