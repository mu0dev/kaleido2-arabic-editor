name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Python engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      KALEIDO_ARABIC_FONT: ${{ github.workspace }}/NotoSansArabic.ttf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Download Noto Sans Arabic test font
        run: >-
          python -c "import os, urllib.request;
          urllib.request.urlretrieve('https://raw.githubusercontent.com/google/fonts/e5ee31305efa101c2cae65f44d9642df2c8f0b4d/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf', os.environ['KALEIDO_ARABIC_FONT'])"
      - name: Check Arabic shaping support
        run: python -c "from PIL import features; assert features.check('raqm'), 'Pillow needs libraqm for Arabic shaping'"
      - name: Compile Python sources
        run: python -m compileall -q app.py engine
      - name: Run asset-free engine tests
        run: python -m unittest discover -s engine/tests -v
